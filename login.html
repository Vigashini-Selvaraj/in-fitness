<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | IN+ FITNESS</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <!-- Navbar Container -->
    <div id="navbar"></div>

    <main>
        <section class="section" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; z-index: 1000; background: url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;">
            <!-- Dark Overlay -->
            <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, rgba(10, 10, 12, 0.9) 0%, rgba(10, 10, 12, 0.6) 100%); z-index: 1;"></div>
            
            <div class="container" style="max-width: 440px; position: relative; z-index: 2; width: 100%; padding: 0 1.5rem;">
                
                <div style="background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 30px; padding: 2.5rem; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 30px 60px rgba(0,0,0,0.6); text-align: center; position: relative; overflow: hidden;">
                    
                    <!-- Decorative element -->
                    <div style="position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: #0A84FF; border-radius: 50%; filter: blur(80px); opacity: 0.3; z-index: -1;"></div>
                    <div style="position: absolute; bottom: -50px; left: -50px; width: 150px; height: 150px; background: #00D2FF; border-radius: 50%; filter: blur(80px); opacity: 0.3; z-index: -1;"></div>

                    <div style="margin-bottom: 2rem;">
                        <h1 style="font-family: 'Space Grotesk', 'Sora', sans-serif; font-size: 2rem; color: #fff; margin-bottom: 0.3rem; font-weight: 700; letter-spacing: -0.5px;">Welcome Back</h1>
                        <p style="color: rgba(255,255,255,0.6); font-size: 0.9rem;">Log in to your IN+ FITNESS account</p>
                    </div>
                    
                    <form action="dashboard.html" method="POST" style="text-align: left;">
                        <div class="form-group" style="margin-bottom: 1.2rem; position: relative;">
                            <label for="email" style="display: block; margin-bottom: 0.4rem; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 0.85rem;">Email Address</label>
                            <div style="position: relative;">
                                <i data-lucide="mail" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); width: 18px; height: 18px;"></i>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required style="width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;" onfocus="this.style.borderColor='#0A84FF'; this.style.background='rgba(0,0,0,0.4)';" onblur="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='rgba(0,0,0,0.2)';">
                            </div>
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 1.2rem; position: relative;">
                            <label for="password" style="display: block; margin-bottom: 0.4rem; color: rgba(255,255,255,0.9); font-weight: 500; font-size: 0.85rem;">Password</label>
                            <div style="position: relative;">
                                <i data-lucide="lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.4); width: 18px; height: 18px;"></i>
                                <input type="password" id="password" name="password" placeholder="Enter your password" required style="width: 100%; padding: 0.9rem 1rem 0.9rem 2.8rem; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 0.95rem; transition: all 0.3s ease; outline: none;" onfocus="this.style.borderColor='#0A84FF'; this.style.background='rgba(0,0,0,0.4)';" onblur="this.style.borderColor='rgba(255,255,255,0.1)'; this.style.background='rgba(0,0,0,0.2)';">
                            </div>
                        </div>
                        
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.85rem;">
                            <label style="display: flex; align-items: center; gap: 0.5rem; color: rgba(255,255,255,0.6); cursor: pointer; transition: color 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.6)'">
                                <input type="checkbox" style="accent-color: #0A84FF; width: 14px; height: 14px; cursor: pointer;"> Remember me
                            </label>
                            <a href="#" style="color: #0A84FF; text-decoration: none; font-weight: 500; transition: opacity 0.3s;" onmouseover="this.style.opacity='0.8'" onmouseout="this.style.opacity='1'">Forgot Password?</a>
                        </div>
                        
                        <button type="submit" style="width: 100%; padding: 1rem; border-radius: 12px; background: linear-gradient(135deg, #00D2FF, #0A84FF); color: #fff; font-weight: 600; font-size: 0.95rem; border: none; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 0.5rem; box-shadow: 0 10px 20px rgba(10, 132, 255, 0.3);" onmouseover="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 15px 25px rgba(10, 132, 255, 0.4)';" onmouseout="this.style.transform='translateY(0)'; this.style.boxShadow='0 10px 20px rgba(10, 132, 255, 0.3)';">
                            <span>LOG IN</span>
                            <i data-lucide="arrow-right" style="width: 16px; height: 16px;"></i>
                        </button>

                        <div style="display: flex; align-items: center; margin: 1.5rem 0; color: rgba(255,255,255,0.4); font-size: 0.85rem;">
                            <hr style="flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.1);">
                            <span style="padding: 0 1rem;">Or continue with</span>
                            <hr style="flex: 1; border: none; border-top: 1px solid rgba(255,255,255,0.1);">
                        </div>

                        <div style="display: flex; gap: 1rem;">
                            <button type="button" style="flex: 1; padding: 0.8rem; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 0.5rem;" onmouseover="this.style.background='rgba(255,255,255,0.1)';" onmouseout="this.style.background='rgba(255,255,255,0.05)';">
                                <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                                Google
                            </button>
                            <button type="button" style="flex: 1; padding: 0.8rem; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-weight: 500; font-size: 0.9rem; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 0.5rem;" onmouseover="this.style.background='rgba(255,255,255,0.1)';" onmouseout="this.style.background='rgba(255,255,255,0.05)';">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="#fff" xmlns="http://www.w3.org/2000/svg"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.05 2.25.68 2.92.68.66 0 1.76-.75 3.35-.64 1.25.04 2.37.52 3.12 1.4-2.69 1.57-2.21 5.38.41 6.51-1.12 2.81-2.94 4.31-4.8 6.02zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                                Apple
                            </button>
                        </div>
                    </form>
                    
                    <p style="margin-top: 1.5rem; color: rgba(255,255,255,0.6); font-size: 0.9rem;">
                        Don't have an account? <a href="register.html" style="color: #fff; font-weight: 600; text-decoration: none; border-bottom: 1px solid #0A84FF; padding-bottom: 2px; transition: all 0.3s;" onmouseover="this.style.color='#0A84FF'" onmouseout="this.style.color='#fff'">Register here</a>
                    </p>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer Container -->
    <div id="footer"></div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/components.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
